name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the check context. Do not rename it without updating the
  # ruleset, or the required check points at a context nothing produces.
  build-firmware:
    name: Build I2Console Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          # CMakeLists.txt derives the version from `git describe --tags`.
          # With the default shallow checkout there is no tag in the clone and
          # FW_VERSION silently degrades to a bare hash.
          fetch-depth: 0

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake

      - name: Build firmware
        run: |
          mkdir build
          cd build
          cmake ..
          make -j"$(nproc)"

      - name: Check build artifacts
        run: |
          ls -lh build/I2Console.uf2
          ls -lh build/I2Console.elf
          ls -lh build/I2Console.bin

      - name: Report the version that was built
        run: cat build/generated/version.h

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware
          path: |
            build/I2Console.uf2
            build/I2Console.elf
            build/I2Console.bin

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      # The coverage floor is hard. The modules under test have no hardware
      # dependency and are fully exercised, so anything below it means a test
      # was lost rather than that the target is unrealistic.
      - name: Run the tests and enforce the coverage floor
        run: make -C tests coverage

  static-analysis:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive

      - name: Install the toolchains
        run: |
          sudo apt-get update
          # Pinned to the major version rather than the `clang-format`
          # wrapper, so an image bump cannot change the formatter underneath
          # the gate. Measured on 12 September 2026: 18.1.3 and 23.1.1 agree
          # on every file in this tree, so a contributor on a newer local
          # toolchain is not fighting CI.
          sudo apt-get install -y clang-format-18 clang-tidy-18 cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi

      # Every file the repository owns, so a new source cannot slip past the
      # gate by not being listed. .clang-format-ignore keeps the vendored STM
      # font tables out of it.
      - name: clang-format
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.c' '*.h' | grep -v '^pico-sdk/')
          test "${#files[@]}" -gt 0
          echo "checking ${#files[@]} files"
          clang-format-18 --dry-run --Werror "${files[@]}"

      - name: Compile database for clang-tidy
        run: |
          set -euo pipefail
          cmake -B build-tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON .
          test -s build-tidy/compile_commands.json

      # clang-tidy runs against a declared list rather than the whole tree.
      # The rest of src/ currently carries 34 findings, tracked in issue #19;
      # a file joins this list once it is clean. The gate is hard for
      # everything on it, so a listed file cannot regress.
      - name: clang-tidy on the qualified files
        env:
          TIDY_FILES: |
            src/circular_buffer.c
            src/main.c
        run: |
          set -euo pipefail
          sysinc="$(arm-none-eabi-gcc -print-sysroot)/include"
          gccinc="$(arm-none-eabi-gcc -print-file-name=include)"
          test -d "$sysinc" && test -d "$gccinc"
          mapfile -t files < <(printf '%s' "$TIDY_FILES" | grep -v '^[[:space:]]*$' | tr -d ' ')
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            test -f "$f" || { echo "::error::$f is on the clang-tidy list but does not exist"; exit 1; }
          done
          clang-tidy-18 --quiet -p build-tidy \
            --extra-arg=--target=arm-none-eabi \
            --extra-arg=-isystem"$sysinc" \
            --extra-arg=-isystem"$gccinc" \
            "${files[@]}"

  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Validate lefthook configuration
        env:
          LEFTHOOK_VERSION: 2.1.12
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/lefthook \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          chmod +x /tmp/lefthook
          /tmp/lefthook version
          /tmp/lefthook validate

      - name: Check title, body and every commit
        # Title and body reach the script exclusively through env, never by
        # interpolation into the script text: otherwise the pull request title
        # would be a shell injection vector.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          # Anchored at the start of the line: by convention a trailer stands on
          # a line of its own. Without the anchor the rule also fires when a
          # body merely mentions the forbidden trailer, for instance to describe
          # a doctor finding, and it then rejects a valid input.
          ban='^[[:space:]]*co-authored-by:.*(claude|anthropic)|^[[:space:]]*generated with.*claude code'

          # On a squash merge the pull request title becomes the subject line on
          # main and thereby determines the next version.
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::pull request title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi

          # With squash_merge_commit_message=PR_BODY the body lands in the commit.
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::the pull request body contains an AI attribution trailer."
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha contains an AI attribution trailer."
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha has an Anthropic address as author or committer."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::notice::switch this off for good in ~/.claude/settings.json: {\"attribution\":{\"commit\":\"\",\"pr\":\"\"}}"
            exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # The pre-push hook scans only the new commits. The full scan over the
      # history belongs here.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Mandatory since the action's breaking change: without a token it
          # aborts on every pull request, and with a message about the missing
          # token rather than about a finding. The automatically generated
          # token suffices.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The only context that should ever become the required check, so that adding
  # or removing a job does not break the repository configuration.
  ci-success:
    name: CI Success
    if: always()
    needs: [build-firmware, unit-tests, static-analysis, commit-hygiene, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Every preceding job must have succeeded or been skipped
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")'
